<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="css/converter.css" rel="stylesheet">
    <title>Title</title>
</head>
<body>
<header></header>
<main>
    <div class="converter">
        <label for="category">Categoría</label>
        <select id="category">
            <option value="temperature">Temperatura</option>
            <option value="length">Longitud</option>
        </select>

        <label for="value">Valor</label>
        <input type="number" id="value" step="any">

        <label for="from-unit">Desde</label>
        <select id="from-unit">
            <optgroup label="Temperatura">
                <option value="celsius">°C</option>
                <option value="fahrenheit">°F</option>
            </optgroup>
            <optgroup label="Longitud">
                <option value="cm">cm</option>
                <option value="m">m</option>
            </optgroup>
        </select>

        <label for="to-unit">Hacia</label>
        <select id="to-unit">
            <optgroup label="Temperatura">
                <option value="celsius">°C</option>
                <option value="fahrenheit">°F</option>
            </optgroup>
            <optgroup label="Longitud">
                <option value="cm">cm</option>
                <option value="m">m</option>
            </optgroup>
        </select>

        <button type="button" id="convert-btn">Convertir</button>

        <p id="result" aria-live="polite"></p>
    </div>
</main>
<footer></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
