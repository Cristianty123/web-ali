<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPB Bookstore - Catalogo</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header">
    <h1>UPB Bookstore</h1>
    <p class="tagline">Catálogo de libros técnicos</p>
</header>

<main>
    <section id="status" class="status" aria-live="polite"></section>

    <section id="catalog" class="catalog" aria-label="Catálogo de libros"></section>

    <aside id="book-detail" class="book-detail hidden " aria-label="Detalle del libro">
        <h2 id="detail-title"></h2>
        <p id="detail-author"></p>
        <p id="detail-price"></p>
        <button type="button" id="close-detail">Cerrar</button>
    </aside>
</main>

<footer class="site-footer">
    <p>Lab 7 - Desarrollo de aplicaciones web</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
