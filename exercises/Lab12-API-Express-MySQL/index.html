<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPB Bookstore - Catálogo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>UPB Bookstore</h1>
      <p class="tagline">Catálogo de libros técnicos</p>
    </header>

    <main>
      <section id="status" class="status" aria-live="polite"></section>

      <section id="new-book" aria-label="Nuevo libro">
        <h2>Nuevo libro</h2>
        <form id="book-form">
          <div>
            <label for="book-title">Título</label>
            <input id="book-title" name="title" type="text" required />
          </div>
          <div>
            <label for="book-author">Autor</label>
            <input id="book-author" name="author" type="text" required />
          </div>
          <div>
            <label for="book-price">Precio</label>
            <input id="book-price" name="price" type="number" step="0.01" min="0" required />
          </div>
          <button type="submit">Agregar</button>
        </form>
      </section>

      <section id="catalog" class="catalog" aria-label="Catálogo de libros"></section>

      <aside id="book-detail" class="book-detail hidden" aria-label="Detalle del libro">
        <h2 id="detail-title"></h2>
        <p id="detail-author"></p>
        <div>
          <label for="detail-price-input">Precio</label>
          <input id="detail-price-input" type="number" step="0.01" min="0" />
        </div>
        <button type="button" id="save-price">Guardar precio</button>
        <button type="button" id="delete-book">Eliminar</button>
        <button type="button" id="close-detail">Cerrar</button>
      </aside>
    </main>

    <footer class="site-footer">
      <p>Lab 12 - Desarrollo de aplicaciones web</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
